<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav__brand" href="#hero">Your Name</a>
      <ul class="nav__links">
        <li><a href="#projects">Projects</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="hero" class="hero">
      <h1>Hi, I'm Your Name</h1>
      <p>Aspiring full-stack developer in training.</p>
      <a class="btn" href="#contact">Get in touch</a>
    </section>
    <section id="projects" class="projects">
      <h2>Projects</h2>
      <div class="projects__grid">
        <article class="card"><h3>Project One</h3><p>What it does.</p></article>
        <article class="card"><h3>Project Two</h3><p>What it does.</p></article>
        <article class="card"><h3>Project Three</h3><p>What it does.</p></article>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <section id="contact">
      <h2>Contact</h2>
      <form action="#" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
        <button class="btn" type="submit">Send</button>
      </form>
    </section>
    <p>© 2027 Your Name</p>
  </footer>
</body>
</html>
